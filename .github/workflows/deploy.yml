name: Deploy to Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Bundle & Upload
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Set build number
        id: build
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "number=$BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD"

      - name: Create local.properties
        env:
          KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "kakao.app.key=$KAKAO_APP_KEY" >> local.properties

      - name: Set up upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > $KEYSTORE_PATH
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      - name: Bundle
        run: ./gradlew bundleProdRelease -PversionCode=${{ steps.build.outputs.number }}

      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.azitcrew.app
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed

      - name: Clean up signing files
        if: always()
        run: rm -f $RUNNER_TEMP/upload.jks keystore.properties
